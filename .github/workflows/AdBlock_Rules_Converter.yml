# 工作流名称
name: AdBlock_Rules_Converter

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'timestamp.txt'
      - '.mihomo_downloaded'
      - '**.exe'
      - 'adblock_reject.*'
      - '.gitignore'
  schedule:
    - cron: 0 */3 * * *
  workflow_dispatch:  # 允许手动触发工作流

jobs:
  # ==========================================
  # 作业 1：在 Windows 环境下生成 YAML 和 TXT 规则文件
  # ==========================================
  generate-rules:
    runs-on: windows-2022

    steps:
    - name: Setup Node.js 24
      uses: actions/setup-node@v6
      with:
        node-version: '24'

    # ✅ 新增配置 Python 环境，以保证新的 python 版脚本高效无缝运行
    - name: Setup Python
      uses: actions/setup-python@v6  # 已修复：升级至 v6 以支持 Node.js 24
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: pip install pyyaml publicsuffixlist
      
    - name: Checkout repository
      uses: actions/checkout@v6      # 已修复：升级至 v6 以支持 Node.js 24

    - name: Run Rule Generators (YAML generated by Python & TXT by PowerShell)
      shell: pwsh
      run: |
        # ✅ 使用全新的 Python 脚本替换原本生成 YAML 的 Powershell 脚本
        python ./adblock_rule_generator_yaml.py
        
        # 保留生成 txt 的 ps1 脚本执行（如果您未来也改为py，同理更改下方指令即可）
        python ./adblock_rule_generator_txt.py

    - name: Force Add, Commit and Push YAML & TXT files
      shell: pwsh  
      env:
        TOKEN: ${{ secrets.TOKEN }}
      run: |
        $repoUrl = "https://${env:TOKEN}@github.com/${{ github.repository }}.git"
        
        git config --global user.name 'github-actions'
        git config --global user.email 'github-actions@github.com'
        # Git 添加生成的输出文件名称并未变更，所以这部分无缝承接
        git add -f adblock_reject.yaml adblock_reject.txt
        
        # 捕获如果未改动抛出的 commit 异常，自动进行 Empty commit 以完成空推
        git commit -m "Update adblock_reject.yaml and adblock_reject.txt"
        if ($LASTEXITCODE -ne 0) {
          git commit --allow-empty -m "Empty commit to force push"
        }
        
        # 带有重试机制的强制推送
        for ($i=1; $i -le 5; $i++) {
          git push $repoUrl HEAD:${{ github.ref }} --force
          if ($LASTEXITCODE -eq 0) { 
             Write-Host "Push YAML & TXT successful."
             exit 0 
          }
          Write-Host "Push failed, retrying in 10 seconds... (Attempt $i)"
          Start-Sleep -Seconds 10
        }
        exit 1

  # ==========================================
  # 作业 2：在 Windows 环境下将 TXT 转换为 MRS（改为从 TXT 生成）
  # ==========================================
  convert-mrs:
    needs: generate-rules  # 确保先生成了规则文件
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6      # 已修复：升级至 v6 以支持 Node.js 24
        with:
          ref: ${{ github.ref }} 

      - name: Pull latest files from Job 1
        shell: powershell
        env:
          TOKEN: ${{ secrets.TOKEN }}
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git pull https://${env:TOKEN}@github.com/${{ github.repository }}.git HEAD:${{ github.ref }} --rebase

      - name: Check, compare and download latest mihomo
        shell: powershell
        run: |
          $exePath = "./mihomo.exe"
          $downloadMarker = "./.mihomo_downloaded"
          $tempZipDir = "./temp_mihomo_extract"
          
          Write-Host "Fetching latest release info from GitHub API..."
          $apiUrl = "https://api.github.com/repos/MetaCubeX/mihomo/releases/latest"
          
          $maxAttempts = 3
          $releaseInfo = $null
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            try {
              $releaseInfo = Invoke-RestMethod -Uri $apiUrl -ErrorAction Stop
              break
            } catch {
              Write-Host "Failed to fetch release info (Attempt $attempt). Error: $_"
              if ($attempt -eq $maxAttempts) { exit 1 }
              Start-Sleep -Seconds 5
            }
          }
          
          $latestVersion = $releaseInfo.tag_name
          $localVersion = ""
          if (Test-Path $downloadMarker) {
            $localVersion = Get-Content -Path $downloadMarker -ErrorAction SilentlyContinue
          }
          
          if (($latestVersion -ne $localVersion) -or -not (Test-Path $exePath)) {
            Write-Host "Update required. Remote: $latestVersion, Local: $localVersion"
            
            $asset = $releaseInfo.assets | Where-Object { $_.name -match "mihomo-windows-amd64-compatible-.*\.zip" }
            if (-not $asset) { throw "Compatible Windows zip asset not found." }
            
            $url = $asset.browser_download_url
            $zipFile = "mihomo_download.zip"
            
            for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
              try {
                # --- 清理旧的残留文件 ---
                if (Test-Path $zipFile) { Remove-Item $zipFile -Force }
                if (Test-Path $tempZipDir) { Remove-Item $tempZipDir -Recurse -Force }
                
                Write-Host "Downloading $url (Attempt $attempt)..."
                Invoke-WebRequest -Uri $url -OutFile $zipFile -TimeoutSec 300
                
                Write-Host "Extracting..."
                Expand-Archive -Path $zipFile -DestinationPath $tempZipDir -Force
                
                # 在解压目录中查找 exe
                $extractedExe = Get-ChildItem -Path $tempZipDir -Recurse -Filter "*.exe" | Select-Object -First 1
                if ($extractedExe) {
                  if (Test-Path $exePath) { Remove-Item $exePath -Force }
                  Move-Item -Path $extractedExe.FullName -Destination $exePath -Force
                  Set-Content -Path $downloadMarker -Value $latestVersion -Force 
                  Write-Host "Successfully updated to $latestVersion!"
                  
                  # 清理临时文件
                  Remove-Item $zipFile -Force
                  Remove-Item $tempZipDir -Recurse -Force
                  break
                } else {
                  throw "Executable not found in zip."
                }
              } catch {
                Write-Host "Attempt $attempt failed: $_"
                if ($attempt -eq $maxAttempts) { exit 1 }
                Start-Sleep -Seconds 10
              }
            }
          } else {
            Write-Host "Already up-to-date ($localVersion)."
          }

      - name: Convert ruleset (yaml -> mrs)
        shell: powershell
        run: |
          $exePath = "./mihomo.exe"
          if (Test-Path $exePath) {
            Write-Host "Starting conversion..."
            $success = $false
            for ($i=1; $i -le 3; $i++) {
              & $exePath convert-ruleset domain text adblock.yaml adblock_reject.mrs
              if ($LASTEXITCODE -eq 0) { $success = $true; break }
              Write-Host "Conversion attempt $i failed, retrying..."
              Start-Sleep -Seconds 3
            }
            if (-not $success) { exit 1 }
          } else {
            Write-Host "mihomo.exe missing!"; exit 1
          }

      - name: Push changes
        shell: powershell
        env:
          TOKEN: ${{ secrets.TOKEN }}
        run: |
          $maxAttempts = 5
          $repoUrl = "https://${env:TOKEN}@github.com/${{ github.repository }}.git"
          
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            try {
              Write-Host "Final sync and push (Attempt $attempt)..."
              git add adblock_reject.mrs mihomo.exe .mihomo_downloaded
              
              if (-not (git status --porcelain)) {
                Write-Host "No changes to commit."
                break
              }

              git commit -m "Auto-update ruleset and mihomo [skip ci]"
              git pull $repoUrl HEAD:${{ github.ref }} --rebase
              git push $repoUrl HEAD:${{ github.ref }} --force
              Write-Host "Push successful."
              break
            } catch {
              Write-Host "Push error: $_"
              if ($attempt -eq $maxAttempts) { exit 1 }
              Start-Sleep -Seconds 20
            }
          }
